esp32_bridge:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    baud_rate: 115200
    mock_hardware: false
    command_rate_hz: 30.0        # must stay >= 20 Hz (ESP32 watchdog is ~300 ms)
    command_timeout_s: 0.3

    # geometry: keep in sync with navigen_description/config/vehicle.yaml + board_config.h
    wheel_radius: 0.0625
    track_width: 0.34
    ticks_per_revolution: 0.0    # SET ME: encoder CPR x gear ratio x 4 (quadrature)

    # limits (conservative demo defaults)
    max_linear_velocity: 0.4     # [m/s]
    max_angular_velocity: 1.0    # [rad/s]
    max_wheel_velocity: 0.6      # [m/s]
    max_linear_accel: 0.8        # [m/s^2]
    max_angular_accel: 2.0       # [rad/s^2]

    ultrasonic_fov_rad: 0.26
    ultrasonic_max_range: 4.0
